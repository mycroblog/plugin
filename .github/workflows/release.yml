# Releases one plugin as its container image, for a tag plugins/<name>/v<version> on a commit of main:
#
#   git tag plugins/my-media-ffmpeg/v0.1.0 <commit> && git push origin plugins/my-media-ffmpeg/v0.1.0
#
# `plan` reads the plugin and the version from the tag and refuses a version that is already published. `build` runs the
# plugin's integration tests in the test stage of its image and pushes the runtime image by digest, on a runner of each
# architecture, so that arm64 is tested on arm64 rather than emulated. `publish` joins the two into one image index,
# tags it, and attests its provenance. Nothing is attached to a GitHub release: the images are the release.
name: Release

on:
  push:
    tags: ["plugins/*/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Named, so that a step runs with -o pipefail.
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      plugin: ${{ steps.tag.outputs.plugin }}
      version: ${{ steps.tag.outputs.version }}
      image: ${{ steps.tag.outputs.image }}
      tags: ${{ steps.tag.outputs.tags }}
      protocol: ${{ steps.tag.outputs.protocol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to check that the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false
      - name: Read the plugin and the version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          re='^plugins/(my-[a-z0-9-]+)/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$'
          if ! [[ $TAG =~ $re ]]; then
            echo "::error::$TAG is not plugins/<name>/v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          plugin="${BASH_REMATCH[1]}" version="${BASH_REMATCH[2]}"
          major="${BASH_REMATCH[3]}" minor="${BASH_REMATCH[4]}" pre="${BASH_REMATCH[6]}"
          if [ ! -f "plugins/$plugin/Dockerfile" ]; then
            echo "::error::$TAG names $plugin, which has no plugins/$plugin/Dockerfile"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is on $(git rev-parse --short HEAD), which is not on main: CI has not tested it"
            exit 1
          fi

          # The version itself, and for a release (not a pre-release) the minor line, and from 1.0.0 on the major line.
          # No latest: a plugin speaks the protocol of one version of mycroblog/my, so a deployment names the version.
          tags="$version"
          if [ -z "$pre" ]; then
            tags+=$'\n'"$major.$minor"
            [ "$major" = 0 ] || tags+=$'\n'"$major"
          fi

          {
            echo "plugin=$plugin"
            echo "version=$version"
            echo "image=ghcr.io/$OWNER/$plugin"
            echo "protocol=$(awk '$1 == "tag:" || $1 == "ref:" { print $2 }' buf.gen.yaml)"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The version is not published yet
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # A published version never changes: a fix is a new version. Re-running a failed job of this run skips plan.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION is already published"
            exit 1
          fi

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: plugins/${{ needs.plan.outputs.plugin }}/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          load: true
          tags: release-test
          provenance: false
      - name: Integration tests, in the test stage of the image
        run: docker run --rm release-test
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the runtime image and push it by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: plugins/${{ needs.plan.outputs.plugin }}/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          # The provenance is attested by publish, on the index; BuildKit's own would add an unknown/unknown platform.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.title=${{ needs.plan.outputs.plugin }}
            org.opencontainers.image.description=${{ needs.plan.outputs.plugin }}, a plugin of mycroblog/my
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/plugins/${{ needs.plan.outputs.plugin }}
            org.opencontainers.image.licenses=MIT
            dev.mycroblog.plugin.protocol=${{ needs.plan.outputs.protocol }}
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for publish
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Join the images into one index, and tag it
        id: index
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAGS: ${{ needs.plan.outputs.tags }}
          PLUGIN: ${{ needs.plan.outputs.plugin }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          args=()
          while read -r tag; do args+=(--tag "$IMAGE:$tag"); done <<< "$TAGS"
          # GitHub Packages shows the description and links the repository from the annotations of the index.
          args+=(
            --annotation "index:org.opencontainers.image.description=$PLUGIN, a plugin of mycroblog/my"
            --annotation "index:org.opencontainers.image.source=$SOURCE"
            --annotation "index:org.opencontainers.image.revision=$REVISION"
            --annotation "index:org.opencontainers.image.version=$VERSION"
            --annotation "index:org.opencontainers.image.licenses=MIT"
          )
          sources=()
          for f in "$RUNNER_TEMP"/digests/*; do sources+=("$IMAGE@sha256:$(basename "$f")"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - name: Attest the provenance of the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.plan.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAGS: ${{ needs.plan.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
          PROTOCOL: ${{ needs.plan.outputs.protocol }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "### $IMAGE:$VERSION"
            echo
            echo "- Tags: $(paste -sd ' ' <<< "$TAGS")"
            echo "- Digest: \`$DIGEST\`"
            echo "- Protocol: mycroblog/my \`$PROTOCOL\`"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$IMAGE:$VERSION -R $REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
