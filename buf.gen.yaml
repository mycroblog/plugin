# Generates the Go code of the plugin protocol from the .proto files of mycroblog/my.
# Run scripts/generate.sh; bump the ref below (a tag, or a commit of main until the next release) to follow the protocol.
version: v2
clean: true
inputs:
  - git_repo: https://github.com/mycroblog/my.git
    subdir: api/plugin
    ref: f55bdcbad12dec9439899dbfc3c13cbcfb6231e5
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mycroblog/plugin/gen
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
