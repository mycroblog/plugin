# Generates the Go code of the plugin protocol from the .proto files of mycroblog/my.
# Run scripts/generate.sh; bump the tag below to follow a new protocol release.
version: v2
clean: true
inputs:
  - git_repo: https://github.com/mycroblog/my.git
    subdir: api/plugin
    tag: v0.1.0-rc.11
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mycroblog/plugin/gen
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
